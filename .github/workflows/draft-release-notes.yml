name: Draft release notes

# Reusable workflow, called via `workflow_call` alongside "Consolidate
# release" when a linked project pushes a `v*.*.*` tag. Drafts a
# user-facing release notes summary from the log entries since the
# previous release tag and commits it straight into the vault — no PR,
# unlike master docs, since it's pinned to one immutable tag rather than
# an evolving official record.
#
# Runs in the caller's context, same as draft-log-entry.yml: the default
# GITHUB_TOKEN is scoped to the caller repo (used for the tags/compare
# lookups against it), while writing into the vault needs the
# devlore-github-token secret instead.
#
# Installs devlore as the published @starterculture/devlore npm package
# rather than checking out the private BubbaF377/devlore source repo —
# every linked project's own devlore-github-token is scoped to repos it
# manages, never to the maintainer's private source, so a checkout-based
# approach only ever worked for the maintainer's own instance.

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      tag:
        required: true
        type: string
      vault-repo:
        required: true
        type: string
    secrets:
      anthropic-api-key:
        required: true
      devlore-github-token:
        required: true

permissions:
  contents: read

jobs:
  draft-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No lockfile exists in this bare install (there's no project
      # checkout here, just `npm install` of one published package) to
      # key a cache off of the usual way (actions/setup-node's own
      # `cache: npm` option needs one) — caching npm's global download
      # cache under a static key instead still avoids re-fetching every
      # dependency tarball, including @napi-rs/keyring's per-platform
      # native binary, on every run.
      - name: Cache npm's download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-devlore-${{ runner.os }}

      - run: npm install @starterculture/devlore

      - run: node node_modules/@starterculture/devlore/dist/actions/draft-release-notes.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          DEVLORE_GITHUB_TOKEN: ${{ secrets.devlore-github-token }}
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_NAME: ${{ inputs.project-name }}
          PROJECT_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VAULT_REPO: ${{ inputs.vault-repo }}
