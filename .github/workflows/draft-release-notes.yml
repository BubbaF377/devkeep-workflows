name: Draft release notes

# Reusable workflow, called via `workflow_call` alongside "Consolidate
# release" when a linked project pushes a `v*.*.*` tag. Drafts a
# user-facing release notes summary from the log entries since the
# previous release tag and commits it straight into the vault — no PR,
# unlike master docs, since it's pinned to one immutable tag rather than
# an evolving official record.
#
# Runs in the caller's context, same as draft-log-entry.yml: the default
# GITHUB_TOKEN is scoped to the caller repo (used for the tags/compare
# lookups against it), while writing into the vault needs the
# devkeep-github-token secret instead.
#
# Installs a published npm package rather than checking out the private
# Devkeep source repo — every linked project's own devkeep-github-token is
# scoped to the repos it manages, never to the maintainer's private
# source, so a checkout-based approach only ever worked for the
# maintainer's own instance.
#
# Installs @starterculture/devkeep-actions rather than the deprecated
# @starterculture/devlore package. Changed 2026-09-02, when Requirement
# #42's generation was ported into Devkeep itself.
#
# Stays in CI because its trigger is a release tag — nobody is watching
# when it fires — which is also why its prompt ships publicly.
#
# Pinned to an exact version, never a range or `latest`.

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      tag:
        required: true
        type: string
      vault-repo:
        required: true
        type: string
    secrets:
      anthropic-api-key:
        required: true
      devkeep-github-token:
        required: true

permissions:
  contents: read

jobs:
  draft-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No lockfile exists in this bare install (there is no project
      # checkout here, just `npm install` of one published package) for
      # actions/setup-node's own `cache: npm` to key off — caching npm's
      # global download cache under a static key instead still avoids
      # re-fetching every dependency tarball on every run.
      - name: Cache npm's download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-devkeep-actions-${{ runner.os }}

      - run: npm install @starterculture/devkeep-actions@0.5.1

      # Two tokens, deliberately. GITHUB_TOKEN is the workflow's own
      # repo-scoped one, used for the project repo's tags and commit range
      # — those need Metadata: Read, which devkeep-github-token does not
      # carry for a linked repo. Found live as a 404 on a first real
      # release; draft-log-entry had already solved it the same way.
      - run: node node_modules/@starterculture/devkeep-actions/dist/draft-release-notes.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          DEVKEEP_GITHUB_TOKEN: ${{ secrets.devkeep-github-token }}
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_NAME: ${{ inputs.project-name }}
          PROJECT_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VAULT_REPO: ${{ inputs.vault-repo }}
