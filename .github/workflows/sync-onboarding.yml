name: Sync onboarding guide

# Reusable workflow (Requirement #48): called via `workflow_call`
# alongside consolidate-release/draft-release-notes/analyze-codebase when
# a linked project pushes a `v*.*.*` tag. Unlike those release-scoped
# docs, this doesn't take a `tag` input at all — the onboarding guide
# isn't about one specific release, just always regenerated at that
# cadence since a real release is itself a meaningful "the world
# changed" event (see sync-onboarding.ts's own header comment for why
# there's no drift-check the way sync-test-plan.yml/sync-user-manual.yml
# have).
#
# Same credential story as sync-test-plan.yml: never needs the caller's
# default GITHUB_TOKEN — only ever does plain content reads/writes
# against the project repo and the vault, and the wizard's own
# devkeep-github-token already has "All repositories" access to both.
#
# Installs a published npm package rather than checking out the private
# Devkeep source repo — every linked project's own devkeep-github-token is
# scoped to the repos it manages, never to the maintainer's private
# source, so a checkout-based approach only ever worked for the
# maintainer's own instance.
#
# Installs @starterculture/devkeep-actions rather than the deprecated
# @starterculture/devlore package. Changed 2026-09-02, when Requirement
# #48's generation was finally ported into Devkeep itself — until then
# this workflow ran standalone Devlore's monorepo-oblivious version.
#
# Stays in CI, unlike the test plan, visualizer and codebase analysis,
# because its trigger is a release tag: nobody is watching when it fires.
# That is also why its prompt is one of the few that ships publicly.
#
# Pinned to an exact version, never a range or `latest`.

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      vault-repo:
        required: true
        type: string
    secrets:
      anthropic-api-key:
        required: true
      devkeep-github-token:
        required: true

permissions:
  contents: read

jobs:
  sync-onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No lockfile exists in this bare install (there is no project
      # checkout here, just `npm install` of one published package) for
      # actions/setup-node's own `cache: npm` to key off — caching npm's
      # global download cache under a static key instead still avoids
      # re-fetching every dependency tarball on every run.
      - name: Cache npm's download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-devkeep-actions-${{ runner.os }}

      - run: npm install @starterculture/devkeep-actions@0.5.1

      - run: node node_modules/@starterculture/devkeep-actions/dist/sync-onboarding.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          DEVKEEP_GITHUB_TOKEN: ${{ secrets.devkeep-github-token }}
          PROJECT_NAME: ${{ inputs.project-name }}
          PROJECT_REPO: ${{ github.repository }}
          VAULT_REPO: ${{ inputs.vault-repo }}
