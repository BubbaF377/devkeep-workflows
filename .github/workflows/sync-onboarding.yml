name: Sync onboarding guide

# Reusable workflow (Requirement #48): called via `workflow_call`
# alongside consolidate-release/draft-release-notes/analyze-codebase when
# a linked project pushes a `v*.*.*` tag. Unlike those release-scoped
# docs, this doesn't take a `tag` input at all — the onboarding guide
# isn't about one specific release, just always regenerated at that
# cadence since a real release is itself a meaningful "the world
# changed" event (see sync-onboarding.ts's own header comment for why
# there's no drift-check the way sync-test-plan.yml/sync-user-manual.yml
# have).
#
# Same credential story as sync-test-plan.yml: never needs the caller's
# default GITHUB_TOKEN — only ever does plain content reads/writes
# against the project repo and the vault, and the wizard's own
# devlore-github-token already has "All repositories" access to both.
#
# Installs devlore as the published @starterculture/devlore npm package
# rather than checking out the private BubbaF377/devlore source repo —
# every linked project's own devlore-github-token is scoped to repos it
# manages, never to the maintainer's private source, so a checkout-based
# approach only ever worked for the maintainer's own instance.

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      vault-repo:
        required: true
        type: string
    secrets:
      anthropic-api-key:
        required: true
      devlore-github-token:
        required: true

permissions:
  contents: read

jobs:
  sync-onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No lockfile exists in this bare install (there's no project
      # checkout here, just `npm install` of one published package) to
      # key a cache off of the usual way (actions/setup-node's own
      # `cache: npm` option needs one) — caching npm's global download
      # cache under a static key instead still avoids re-fetching every
      # dependency tarball, including @napi-rs/keyring's per-platform
      # native binary, on every run.
      - name: Cache npm's download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-devlore-${{ runner.os }}

      - run: npm install @starterculture/devlore

      - run: node node_modules/@starterculture/devlore/dist/actions/sync-onboarding.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          DEVLORE_GITHUB_TOKEN: ${{ secrets.devlore-github-token }}
          PROJECT_NAME: ${{ inputs.project-name }}
          PROJECT_REPO: ${{ github.repository }}
          VAULT_REPO: ${{ inputs.vault-repo }}
