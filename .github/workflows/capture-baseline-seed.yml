name: Capture baseline (seed)

# Reusable workflow (docs/PRODUCT.md Open Questions, "Backfilling
# documentation for an existing project linked with prior history"):
# dispatched once the wizard's confirm step has already committed the
# reviewed Requirements backfill to docs/PRODUCT.md. Reads the two
# drafts capture-baseline-draft.yml staged in the vault (no Claude call
# for the Requirements themselves in this phase), opens a PR against the
# vault seeding this project's first master docs, and writes its first
# Onboarding guide directly to the project repo — no checkout needed,
# same as sync-onboarding.yml, since this only ever does plain content
# reads/writes against the project repo and the vault via the wizard's
# own devlore-github-token.
#
# Installs devlore as the published @starterculture/devlore npm package
# rather than checking out the private BubbaF377/devlore source repo —
# every linked project's own devlore-github-token is scoped to repos it
# manages, never to the maintainer's private source, so a checkout-based
# approach only ever worked for the maintainer's own instance.

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      vault-repo:
        required: true
        type: string
    secrets:
      anthropic-api-key:
        required: true
      devlore-github-token:
        required: true

permissions:
  contents: read

jobs:
  capture-baseline-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install @starterculture/devlore

      - run: node node_modules/@starterculture/devlore/dist/actions/capture-baseline.js
        env:
          PHASE: seed
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          DEVLORE_GITHUB_TOKEN: ${{ secrets.devlore-github-token }}
          PROJECT_NAME: ${{ inputs.project-name }}
          PROJECT_REPO: ${{ github.repository }}
          VAULT_REPO: ${{ inputs.vault-repo }}
