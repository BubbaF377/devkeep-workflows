name: Consolidate release

# Reusable workflow (Requirement #8), called via `workflow_call` when a
# linked project pushes a `v*.*.*` tag. Reads log entries since the last
# release plus current master docs, drafts an update, and opens a PR
# against this repo — never commits directly (Requirement #5).
#
# Runs in the caller's context, same as draft-log-entry.yml and
# draft-release-notes.yml: the default GITHUB_TOKEN is scoped to the
# caller repo (used for the tags/compare lookups against it), while
# writing into the vault needs the devkeep-github-token secret instead.
#
# Checks out Devkeep's own source (BubbaF377/devkeep, private) and builds
# it fresh on every run, rather than installing a published npm package —
# see draft-log-entry.yml for why (Requirement #25 superseded).

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      tag:
        required: true
        type: string
      vault-repo:
        required: true
        type: string
    secrets:
      anthropic-api-key:
        required: true
      devkeep-github-token:
        required: true

permissions:
  contents: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Devkeep's own source
        uses: actions/checkout@v4
        with:
          repository: BubbaF377/devkeep
          ref: main
          token: ${{ secrets.devkeep-github-token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build --prefix modules/core
      - run: npm run build --prefix modules/devlore

      - run: node modules/devlore/dist/bin/consolidateReleaseCli.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          DEVKEEP_GITHUB_TOKEN: ${{ secrets.devkeep-github-token }}
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_NAME: ${{ inputs.project-name }}
          PROJECT_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VAULT_REPO: ${{ inputs.vault-repo }}
