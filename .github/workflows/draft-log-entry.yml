name: Draft log entry

# Reusable workflow (Requirement #8): a linked project repo's own caller
# workflow calls this via `workflow_call` on every push, so the
# diff/Claude/commit logic lives here once instead of being duplicated
# per project.
#
# Runs in the caller's context: the default GITHUB_TOKEN is scoped to the
# caller repo (used to read its diff via the compare API), while writing
# into the vault needs the devkeep-github-token secret instead.
#
# Checks out Devkeep's own source (BubbaF377/devkeep, private) and builds
# it fresh on every run, rather than installing a published npm package —
# Devkeep isn't distributed as a standalone package (see its own
# docs/PRODUCT.md — Requirement #25 was superseded when Devlore moved
# into Devkeep's single shared runtime). Every linked project's own
# devkeep-github-token already has "All repositories" access, which is
# what this checkout of a separate, private repo needs.

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      vault-repo:
        required: true
        type: string
    secrets:
      anthropic-api-key:
        required: true
      devkeep-github-token:
        required: true

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Devkeep's own source
        uses: actions/checkout@v4
        with:
          repository: BubbaF377/devkeep
          ref: main
          token: ${{ secrets.devkeep-github-token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build --prefix modules/core
      - run: npm run build --prefix modules/devlore

      - run: node modules/devlore/dist/bin/draftLogEntryCli.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          DEVKEEP_GITHUB_TOKEN: ${{ secrets.devkeep-github-token }}
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_NAME: ${{ inputs.project-name }}
          PROJECT_REPO: ${{ github.repository }}
          VAULT_REPO: ${{ inputs.vault-repo }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
