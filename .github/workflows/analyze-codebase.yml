name: Analyze codebase

# Reusable workflow (Requirement #34): dispatched once by the setup wizard
# right after a project is linked or created, via workflow_dispatch — not
# on every push, unlike draft-log-entry.yml. Needs the caller's actual file
# tree, not just a diff, so this checks out the caller's own repo (for the
# content to analyze) into its own path, distinct from devlore's own
# installed location.
#
# Installs devlore as the published @starterculture/devlore npm package
# rather than checking out the private BubbaF377/devlore source repo —
# every linked project's own devlore-github-token is scoped to repos it
# manages, never to the maintainer's private source, so a checkout-based
# approach only ever worked for the maintainer's own instance. The
# project checkout below is unrelated and still needed — that's the
# caller's own repo, not devlore's source.

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      vault-repo:
        required: true
        type: string
    secrets:
      anthropic-api-key:
        required: true
      devlore-github-token:
        required: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          path: project

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No lockfile exists in this bare install (there's no project
      # checkout here, just `npm install` of one published package) to
      # key a cache off of the usual way (actions/setup-node's own
      # `cache: npm` option needs one) — caching npm's global download
      # cache under a static key instead still avoids re-fetching every
      # dependency tarball, including @napi-rs/keyring's per-platform
      # native binary, on every run.
      - name: Cache npm's download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-devlore-${{ runner.os }}

      - run: npm install @starterculture/devlore

      - run: node node_modules/@starterculture/devlore/dist/actions/analyze-codebase.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          DEVLORE_GITHUB_TOKEN: ${{ secrets.devlore-github-token }}
          PROJECT_NAME: ${{ inputs.project-name }}
          VAULT_REPO: ${{ inputs.vault-repo }}
          PROJECT_PATH: ${{ github.workspace }}/project
