name: Sync user manual

# Reusable workflow (Requirement #38): a linked project repo's own
# devlore.yml calls this via `workflow_call` on every push, alongside
# draft-log-entry.yml and sync-test-plan.yml — but it's a no-op on most
# pushes. It only regenerates docs/USER_MANUAL.md when the project's own
# docs/PRODUCT.md requirements have actually changed since the last
# generation (detected in-script via a content hash embedded in the
# manual's own banner).
#
# Unlike draft-log-entry.yml, this never needs the caller's default
# GITHUB_TOKEN — it only ever does plain content reads/writes against the
# project repo and a usage write into the vault, and the wizard's own
# devlore-github-token already has "All repositories" access to both.

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      vault-repo:
        required: true
        type: string
    secrets:
      anthropic-api-key:
        required: true
      devlore-github-token:
        required: true

permissions:
  contents: read

# Serialize per project repo: the wizard's linking sequence pushes several
# commits in a row (docs/PRODUCT.md, then each caller workflow file), and
# once devlore.yml exists, every one of those pushes re-triggers it — so
# without this, concurrent runs race the Contents API's create-vs-update
# check on docs/USER_MANUAL.md (one run's "no existing file" read goes
# stale the instant another run creates it, so its own create call 422s).
concurrency:
  group: sync-user-manual-${{ github.repository }}

jobs:
  sync-user-manual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout devlore
        uses: actions/checkout@v7
        with:
          repository: BubbaF377/devlore
          token: ${{ secrets.devlore-github-token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx ts-node src/actions/sync-user-manual.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          DEVLORE_GITHUB_TOKEN: ${{ secrets.devlore-github-token }}
          PROJECT_NAME: ${{ inputs.project-name }}
          PROJECT_REPO: ${{ github.repository }}
          VAULT_REPO: ${{ inputs.vault-repo }}
