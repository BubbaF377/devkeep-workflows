name: Sync user manual

# Reusable workflow (Requirement #38): a linked project repo's own caller
# workflow calls this via `workflow_call` on every push, alongside
# draft-log-entry.yml and sync-test-plan.yml — but it's a no-op on most
# pushes. It only regenerates docs/USER_MANUAL.md when the project's own
# docs/PRODUCT.md requirements have actually changed since the last
# generation (detected in-script via a content hash embedded in the
# manual's own banner) — or, for a Devkeep-style monorepo with its own
# docs/MODULES.md, per module.
#
# Unlike draft-log-entry.yml, this never needs the caller's default
# GITHUB_TOKEN — it only ever does plain content reads/writes against the
# project repo and a usage write into the vault, and the wizard's own
# devkeep-github-token already has "All repositories" access to both.
#
# Checks out Devkeep's own source (BubbaF377/devkeep, private) and builds
# it fresh on every run, rather than installing a published npm package —
# see draft-log-entry.yml for why (Requirement #25 superseded).

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      vault-repo:
        required: true
        type: string
    secrets:
      anthropic-api-key:
        required: true
      devkeep-github-token:
        required: true

permissions:
  contents: read

# Serialize per project repo: the wizard's linking sequence pushes several
# commits in a row (docs/PRODUCT.md, then each caller workflow file), and
# once the caller workflow exists, every one of those pushes re-triggers
# it — so without this, concurrent runs race the Contents API's
# create-vs-update check on docs/USER_MANUAL.md (one run's "no existing
# file" read goes stale the instant another run creates it, so its own
# create call 422s).
concurrency:
  group: sync-user-manual-${{ github.repository }}

jobs:
  sync-user-manual:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Devkeep's own source
        uses: actions/checkout@v4
        with:
          repository: BubbaF377/devkeep
          ref: main
          token: ${{ secrets.devkeep-github-token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build --prefix modules/core
      - run: npm run build --prefix modules/devlore

      - run: node modules/devlore/dist/bin/syncUserManualCli.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          DEVKEEP_GITHUB_TOKEN: ${{ secrets.devkeep-github-token }}
          PROJECT_NAME: ${{ inputs.project-name }}
          PROJECT_REPO: ${{ github.repository }}
          VAULT_REPO: ${{ inputs.vault-repo }}
