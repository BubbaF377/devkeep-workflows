name: Sync test plan

# Reusable workflow (Requirement #35): a linked project repo's own
# devlore.yml calls this via `workflow_call` on every push, alongside
# draft-log-entry.yml — but it's a no-op on most pushes. It only
# regenerates docs/TEST_PLAN.md when the project's own docs/PRODUCT.md
# requirements have actually changed since the last generation (detected
# in-script via a content hash embedded in the test plan's own banner).
#
# Unlike draft-log-entry.yml, this never needs the caller's default
# GITHUB_TOKEN — it only ever does plain content reads/writes against the
# project repo and a usage write into the vault, and the wizard's own
# devlore-github-token already has "All repositories" access to both.
#
# Installs devlore as the published @starterculture/devlore npm package
# rather than checking out the private BubbaF377/devlore source repo —
# every linked project's own devlore-github-token is scoped to repos it
# manages, never to the maintainer's private source, so a checkout-based
# approach only ever worked for the maintainer's own instance.

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      vault-repo:
        required: true
        type: string
    secrets:
      anthropic-api-key:
        required: true
      devlore-github-token:
        required: true

permissions:
  contents: read

# Serialize per project repo: the wizard's linking sequence pushes several
# commits in a row (docs/PRODUCT.md, then each caller workflow file), and
# once devlore.yml exists, every one of those pushes re-triggers it — so
# without this, concurrent runs race the Contents API's create-vs-update
# check on docs/TEST_PLAN.md (one run's "no existing file" read goes stale
# the instant another run creates it, so its own create call 422s).
concurrency:
  group: sync-test-plan-${{ github.repository }}

jobs:
  sync-test-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No lockfile exists in this bare install (there's no project
      # checkout here, just `npm install` of one published package) to
      # key a cache off of the usual way (actions/setup-node's own
      # `cache: npm` option needs one) — caching npm's global download
      # cache under a static key instead still avoids re-fetching every
      # dependency tarball, including @napi-rs/keyring's per-platform
      # native binary, on every run.
      - name: Cache npm's download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-devlore-${{ runner.os }}

      - run: npm install @starterculture/devlore

      - run: node node_modules/@starterculture/devlore/dist/actions/sync-test-plan.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          DEVLORE_GITHUB_TOKEN: ${{ secrets.devlore-github-token }}
          PROJECT_NAME: ${{ inputs.project-name }}
          PROJECT_REPO: ${{ github.repository }}
          VAULT_REPO: ${{ inputs.vault-repo }}
