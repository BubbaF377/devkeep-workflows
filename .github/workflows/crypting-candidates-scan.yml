name: Crypting candidates scan

# Reusable workflow (Requirement #8, same pattern as draft-log-entry.yml):
# a linked project repo's own caller workflow calls this via
# `workflow_call` on every push, scanning the diff for possible secrets
# (Category A) and vendor/API references worth crypting (Category B) and
# writing any hits into the vault as Devcrypt candidates for review.
#
# Runs in the caller's context: the default GITHUB_TOKEN is scoped to the
# caller repo (used to read its diff via the compare API), while writing
# into the vault needs the devkeep-github-token secret instead. No
# project-name input — the candidate records key off PROJECT_REPO, not a
# human-readable name.
#
# Installs @starterculture/devkeep-actions — a bundled build of Devkeep's
# CI entrypoints — rather than checking out BubbaF377/devkeep and
# building it. Changed 2026-09-02, and it is the change that makes
# Devkeep work for anyone who is not its author: the checkout needed a
# devkeep-github-token that could read Devkeep's own private source,
# which only ever worked for the one account that owns it. A linked
# project's token now needs nothing beyond its own repo and the vault.
#
# Pinned to an exact version, never a range or `latest`: with a floating
# pin, one publish changes behaviour under every linked project at once,
# with no version boundary to debug against.
on:
  workflow_call:
    inputs:
      vault-repo:
        required: true
        type: string
    secrets:
      devkeep-github-token:
        required: true
      devcrypt-blind-index-key:
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No lockfile exists in this bare install (there is no project
      # checkout here, just `npm install` of one published package) for
      # actions/setup-node's own `cache: npm` to key off — caching npm's
      # global download cache under a static key instead still avoids
      # re-fetching every dependency tarball on every run.
      - name: Cache npm's download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-devkeep-actions-${{ runner.os }}

      - run: npm install @starterculture/devkeep-actions@0.4.0

      - run: node node_modules/@starterculture/devkeep-actions/dist/crypting-candidates-scan.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEVKEEP_GITHUB_TOKEN: ${{ secrets.devkeep-github-token }}
          DEVCRYPT_BLIND_INDEX_KEY: ${{ secrets.devcrypt-blind-index-key }}
          PROJECT_REPO: ${{ github.repository }}
          VAULT_REPO: ${{ inputs.vault-repo }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
