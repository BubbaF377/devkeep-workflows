name: Capture baseline (draft)

# Reusable workflow (docs/PRODUCT.md Open Questions, "Backfilling
# documentation for an existing project linked with prior history"):
# dispatched once by the setup wizard's opt-in "Analyze existing code"
# step, right after a first-time link — via workflow_dispatch, not on
# every push, same as analyze-codebase.yml. Reads the caller's actual
# file tree, so this checks out the caller's own repo (for the content
# to analyze) into its own path, distinct from devlore's own installed
# location — same shape as analyze-codebase.yml.
#
# Drafts a Requirements backfill and a baseline master-docs seed and
# stages both in the vault for review; touches nothing else — no
# docs/PRODUCT.md write, no PR. See capture-baseline-seed.yml for the
# second phase, dispatched only after a human confirms.
#
# Installs devlore as the published @starterculture/devlore npm package
# rather than checking out the private BubbaF377/devlore source repo —
# every linked project's own devlore-github-token is scoped to repos it
# manages, never to the maintainer's private source, so a checkout-based
# approach only ever worked for the maintainer's own instance. The
# project checkout below is unrelated and still needed — that's the
# caller's own repo, not devlore's source.

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      vault-repo:
        required: true
        type: string
    secrets:
      anthropic-api-key:
        required: true
      devlore-github-token:
        required: true

permissions:
  contents: read

jobs:
  capture-baseline-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          path: project

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No lockfile exists in this bare install (there's no project
      # checkout here, just `npm install` of one published package) to
      # key a cache off of the usual way (actions/setup-node's own
      # `cache: npm` option needs one) — caching npm's global download
      # cache under a static key instead still avoids re-fetching every
      # dependency tarball, including @napi-rs/keyring's per-platform
      # native binary, on every run.
      - name: Cache npm's download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-devlore-${{ runner.os }}

      - run: npm install @starterculture/devlore

      - run: node node_modules/@starterculture/devlore/dist/actions/capture-baseline.js
        env:
          PHASE: draft
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          DEVLORE_GITHUB_TOKEN: ${{ secrets.devlore-github-token }}
          PROJECT_NAME: ${{ inputs.project-name }}
          VAULT_REPO: ${{ inputs.vault-repo }}
          PROJECT_PATH: ${{ github.workspace }}/project
